<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Участок Гупо-дон</title>
<style>
html,body{height:100%;margin:0;background:#eef1f4}
#map{position:fixed;inset:0}
#msg{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));font:14px system-ui,sans-serif;color:#c92a2a;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10}
</style>
</head>
<body>
<div id="map"></div>
<div id="msg" hidden></div>
<script>
const APPKEY='53f83a531954055ca29efd3e8a0d1a45';
const fail=t=>{const m=document.getElementById('msg');m.textContent=t;m.hidden=false;};
const s=document.createElement('script');
s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+APPKEY+'&libraries=services&autoload=false';
s.onload=()=>kakao.maps.load(()=>{
  const map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.2075,129.0065),level:4});
  // center on the territory (포천초등학교 is in the middle of it)
  new kakao.maps.services.Places().keywordSearch('포천초등학교',(r,st)=>{
    if(st===kakao.maps.services.Status.OK&&r[0])map.setCenter(new kakao.maps.LatLng(r[0].y,r[0].x));
  },{location:map.getCenter(),radius:5000});
});
s.onerror=()=>fail('KakaoMap не загрузился. Проверь интернет.');
document.head.appendChild(s);
</script>
</body>
</html>
