<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Участок Гупо-дон</title>
<style>
:root{--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.86);--ink:#18212b;--muted:#5b6672;--line:#dde2e8;--accent:#1f4fd1;--note:#e8590c}
html,body{height:100%;margin:0;background:#eef1f4}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
#map{position:fixed;inset:0}
#msg{position:fixed;left:12px;right:52px;top:max(12px,env(safe-area-inset-top));font-size:13px;color:var(--muted);background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:8px 12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:10}
#msg.err{color:#c92a2a}
.pop{position:relative;width:min(300px,calc(100vw - 40px));background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);margin-bottom:14px;font-size:14px;overflow:hidden}
.pop:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--glass2)}
.pop .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
.head{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 40px 10px 14px;cursor:pointer;font:inherit;color:inherit}
.head .new{font-weight:700;font-size:15px;line-height:1.3}
.head .bld{font-weight:400;color:var(--muted)}
.head .old{color:var(--muted);font-size:13px;margin-top:3px}
.head .more{color:var(--accent);font-size:12.5px;margin-top:6px}
.lbl{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.lbl.n{background:#e7edff;color:#1f4fd1}.lbl.o{background:#eef0f2;color:#5b6672}
.body{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.notes{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.note{background:rgba(255,246,238,.75);border:1px solid #ffd8bd;border-radius:8px;padding:7px 9px;display:grid;grid-template-columns:1fr auto;gap:4px}
.note .t{white-space:pre-wrap;word-break:break-word}
.note .d{grid-column:1/2;font-size:11px;color:var(--muted)}
.note button{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.empty{color:var(--muted);font-size:13px}
textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:none;min-height:56px;background:rgba(255,255,255,.7);width:100%;box-sizing:border-box}
.add{align-self:flex-end;border:0;background:rgba(31,79,209,.9);color:#fff;font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tab{position:fixed;right:0;top:calc(max(12px,env(safe-area-inset-top)) + 4px);z-index:20;width:34px;height:64px;border:0;border-radius:14px 0 0 14px;background:rgba(60,52,58,.82);color:#f1e9ee;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:grid;place-items:center;transition:opacity .2s}
#tab svg{width:14px;height:24px}
#sbar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:21;transform:translateX(calc(100% + 24px));transition:transform .25s ease;pointer-events:none}
#sbar.open{transform:none;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#sbar{transition:none}}
.sbox{display:flex;align-items:center;gap:4px;background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.25);padding:4px 4px 4px 12px}
.sbox input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;padding:9px 0;background:none;color:var(--ink)}
.sbox button{width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:8px}
#sugg{list-style:none;margin:6px 0 0;padding:4px 0;background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.2);max-height:50vh;overflow:auto}
#sugg:empty{display:none}
#sugg li{padding:9px 14px;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.06)}
#sugg li:last-child{border-bottom:0}
#sugg li:hover,#sugg li.act{background:rgba(31,79,209,.08)}
#sugg .nm{font-weight:600}
#sugg .ad{font-size:12.5px;color:var(--muted);margin-top:2px}
#sugg .tag{font-size:10.5px;font-weight:700;color:var(--note);margin-left:6px}
#sugg li.none{color:var(--muted);cursor:default;background:none}

/* ---- drawing menu ---- */
#fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 12px);z-index:22;width:58px;height:58px;border-radius:50%;border:0;background:rgba(31,79,209,.88);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center;transition:transform .2s}
#fab svg{width:26px;height:26px}
#fab.open{transform:rotate(45deg)}
#fab .unused{position:absolute;right:3px;bottom:3px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;transform:rotate(-45deg)}
#menu{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 82px);z-index:22;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.mi span{background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:var(--ink);font-size:13.5px;font-weight:600;padding:5px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mi i{width:46px;height:46px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:19px;color:var(--ink);margin-right:6px}
.mi i svg{width:22px;height:22px}
.mi.on i{background:rgba(31,79,209,.88);color:#fff}
.sub{display:flex;gap:8px;background:var(--glass);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:24px;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-right:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 40px)}
.sub[hidden]{display:none}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccd;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sub.list{flex-direction:column;border-radius:12px;padding:6px}
.sub.list button{border:0;background:none;font:inherit;font-size:14px;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.sub.list button:hover{background:rgba(0,0,0,.05)}
.sub.list button.danger{color:#c92a2a}
.style{display:flex;flex-direction:column;gap:8px}
.style .sws{display:flex;gap:8px;flex-wrap:wrap}
.style .sw{width:30px;height:30px;border-radius:50%!important;padding:0!important;border:3px solid #fff!important;box-shadow:0 0 0 1px #ccd}
.style .sw.on{box-shadow:0 0 0 3px #18212b}
.style label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.style input[type=range]{flex:1;min-width:0;accent-color:#1f4fd1}
.style b{min-width:38px;text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.style .pv{height:6px;border-radius:3px;flex:0 0 26px}
#tsheet .th{font-size:13px;color:var(--muted)}
.op{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:8px 12px 10px;font-size:14px;color:var(--ink);border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:2px}
.op b{color:var(--muted);font-weight:600}
.op input{width:100%;accent-color:#1f4fd1}
#toolbar{position:fixed;left:max(12px,env(safe-area-inset-left));right:calc(max(16px,env(safe-area-inset-right)) + 70px);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 12px);z-index:21;background:var(--glass);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.25);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#toolbar[hidden]{display:none}
#toolbar .th{font-size:13px;color:var(--muted)}
#toolbar .tb{display:flex;gap:6px;flex-wrap:wrap}
#toolbar button{border:1px solid var(--line);background:rgba(255,255,255,.7);font:inherit;font-size:13.5px;border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--ink)}
#toolbar button.pri{background:rgba(31,79,209,.9);border-color:var(--accent);color:#fff;font-weight:600}
#toolbar button.danger{color:#c92a2a}
#cross{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:15;pointer-events:none}
#cross[hidden]{display:none}
.lab{position:relative;margin-bottom:9px;padding:5px 11px;border-radius:11px;background:var(--bg);color:#fff;font:700 14px system-ui,sans-serif;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s}
.lab:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top:9px solid var(--bg)}
.lab.lift{transform:translateY(-4px) scale(1.08);box-shadow:0 8px 18px rgba(0,0,0,.35)}
#map.dragging{cursor:grabbing}
.lab.sel{outline:3px solid #fff;box-shadow:0 0 0 6px rgba(31,79,209,.85),0 4px 12px rgba(0,0,0,.35)}
.lab.off{pointer-events:none}
#tsheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.25);padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px}
#tsheet[hidden]{display:none}
#tsheet input{background:rgba(255,255,255,.75);font:inherit;font-size:17px;border:1px solid var(--line);border-radius:8px;padding:10px}
#tsheet .tb{display:flex;gap:8px;justify-content:flex-end}
#tsheet button{border:1px solid var(--line);background:rgba(255,255,255,.7);font:inherit;font-size:14px;border-radius:8px;padding:9px 14px;cursor:pointer}
#tsheet button.pri{background:rgba(31,79,209,.9);border-color:var(--accent);color:#fff;font-weight:600}
#tsheet button.danger{color:#c92a2a;margin-right:auto}
</style>
</head>
<body>
<div id="map"></div>
<button id="tab" aria-label="Открыть поиск" aria-expanded="false"><svg viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 3 12l8 9"/></svg></button>
<div id="sbar" role="search">
  <div class="sbox"><input id="sq" type="search" placeholder="Адрес, дом или место" autocomplete="off" enterkeyhint="search" aria-label="Поиск"><button id="sclose" aria-label="Закрыть поиск">✕</button></div>
  <ul id="sugg"></ul>
</div>
<div id="cross" hidden><svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="9" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="22" cy="22" r="9" fill="none" stroke="#c92a2a" stroke-width="2.5"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round"/><circle cx="22" cy="22" r="1.8" fill="#c92a2a"/></svg></div>
<div id="menu" hidden>
  <button class="mi" id="mText"><span>Текст или цифры</span><i>T</i></button>
  <button class="mi" id="mArrow"><span>Стрелка</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M10 5h9v9"/></svg></i></button>
  <button class="mi" id="mEdit"><span>Редактировать рисунки</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v10.5M9 4a1.6 1.6 0 0 1 3.2 0v6l4.4.9a2 2 0 0 1 1.6 2.3L17.4 18a3 3 0 0 1-3 2.5H11a3 3 0 0 1-2.4-1.2L5.4 15a1.6 1.6 0 0 1 2.5-2l1.1 1.5"/></svg></i></button>
  <div class="sub list" id="moreSub" hidden>
    <button id="mUndo">Отменить последнее</button>
    <button id="mHide">Скрыть рисунки</button>
    <button id="mClear" class="danger">Удалить все надписи и стрелки</button>
  </div>
  <button class="mi" id="mMore"><span>Ещё</span><i>⋯</i></button>
  <button class="mi" id="mZone"><span>Граница участка</span><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="3 2.4"><path d="M4 7 11 3l9 5-2 11-12 2z"/></svg></i></button>
</div>
<button id="fab" aria-label="Меню рисования" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toolbar" hidden><div class="th" id="tHint"></div><div class="style" id="tStyle"></div><div class="tb" id="tBtns"></div></div>
<div id="tsheet" hidden><div class="th" id="sTitle"></div><input id="tIn" placeholder="Текст или цифры" enterkeyhint="done" maxlength="40"><div class="style" id="sStyle"></div><div class="tb"><button class="danger" id="tDel">Удалить</button><button id="tCancel">Отмена</button><button class="pri" id="tOk">Готово</button></div></div>
<div id="msg" hidden></div>
<script>
const APPKEY='53f83a531954055ca29efd3e8a0d1a45';
const NOTES_KEY='gupo-notes-v1', BLD_KEY='gupo-bld-v1:';
const msgEl=document.getElementById('msg');
let msgT;function msg(t,err,ms){msgEl.textContent=t;msgEl.className=err?'err':'';msgEl.hidden=false;clearTimeout(msgT);if(ms)msgT=setTimeout(()=>msgEl.hidden=true,ms);}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=a=>(a||'').replace(/^부산(광역시)?\s+북구\s+/,'');

const s=document.createElement('script');
s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+APPKEY+'&libraries=services&autoload=false';
s.onload=()=>kakao.maps.load(init);
s.onerror=()=>msg('KakaoMap не загрузился. Проверь интернет.',true);
document.head.appendChild(s);

let map,geocoder,hl=null,pop=null,noteShapes=[];
let notes=store.get(NOTES_KEY,{});        // key -> {nw,old,bld,path,notes:[{t,at}]}
const buildings=new Map();               // osm id -> {path:[[lat,lng]], bb:[minLat,minLng,maxLat,maxLng]}
const tilesDone=new Set(),tilesLoading=new Set();

function init(){
  map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(35.2075,129.0065),level:3});
  geocoder=new kakao.maps.services.Geocoder();
  new kakao.maps.services.Places().keywordSearch('포천초등학교',(r,st)=>{
    if(st===kakao.maps.services.Status.OK&&r[0])map.setCenter(new kakao.maps.LatLng(r[0].y,r[0].x));
  },{location:map.getCenter(),radius:5000});
  kakao.maps.event.addListener(map,'click',e=>onTap(e.latLng));
  kakao.maps.event.addListener(map,'idle',loadVisible);
  drawNoted();drawAll();
  msg('Нажми или зажми дом, чтобы увидеть адрес и заметки.',false,5000);
}

// ---------- building outlines from OpenStreetMap (cached per ~550 m tile) ----------
const T=0.005;
function tileKeys(b){const sw=b.getSouthWest(),ne=b.getNorthEast(),ks=[];
  for(let y=Math.floor(sw.getLat()/T);y<=Math.floor(ne.getLat()/T);y++)for(let x=Math.floor(sw.getLng()/T);x<=Math.floor(ne.getLng()/T);x++)ks.push(y+'_'+x);return ks;}
function addWays(ways){ways.forEach(w=>{if(buildings.has(w.id))return;const path=w.g;let a=90,b=180,c=-90,d=-180;
  path.forEach(([la,ln])=>{a=Math.min(a,la);b=Math.min(b,ln);c=Math.max(c,la);d=Math.max(d,ln);});buildings.set(w.id,{path,bb:[a,b,c,d]});});}
async function fetchTile(k){
  const cached=store.get(BLD_KEY+k,null);
  if(cached&&Date.now()-cached.at<30*864e5){addWays(cached.w);tilesDone.add(k);return;}
  const [y,x]=k.split('_').map(Number),bbox=[y*T,x*T,(y+1)*T,(x+1)*T].map(v=>v.toFixed(4)).join(',');
  const q=`[out:json][timeout:25];way["building"](${bbox});out geom;`;
  for(const ep of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
    try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(!r.ok)continue;const j=await r.json();
      const w=j.elements.filter(e=>e.geometry).map(e=>({id:e.id,g:e.geometry.map(p=>[+p.lat.toFixed(6),+p.lon.toFixed(6)])}));
      addWays(w);store.set(BLD_KEY+k,{at:Date.now(),w});tilesDone.add(k);return;}catch(e){}
  }
  throw new Error('osm');
}
async function loadVisible(){
  if(map.getLevel()>4)return;
  const ks=tileKeys(map.getBounds()).filter(k=>!tilesDone.has(k)&&!tilesLoading.has(k));
  if(!ks.length)return;
  ks.forEach(k=>tilesLoading.add(k));
  const r=await Promise.allSettled(ks.map(fetchTile));ks.forEach(k=>tilesLoading.delete(k));
  if(r.some(x=>x.status==='rejected'))msg('Контуры домов загрузились не везде. Дом всё равно можно выбрать, просто без контура.',true,5000);
}
function inPoly(lat,lng,path){let ins=false;for(let i=0,j=path.length-1;i<path.length;j=i++){const [yi,xi]=path[i],[yj,xj]=path[j];
  if((yi>lat)!==(yj>lat)&&lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function buildingAt(lat,lng){let best=null,area=1e9;
  for(const b of buildings.values()){const[a,c,d,e]=b.bb;if(lat<a||lat>d||lng<c||lng>e)continue;
    if(inPoly(lat,lng,b.path)){const ar=(d-a)*(e-c);if(ar<area){area=ar;best=b;}}}return best;}
function center(path){let la=0,ln=0;path.forEach(p=>{la+=p[0];ln+=p[1];});return[la/path.length,ln/path.length];}

// ---------- tap → highlight + popup ----------
function clearSel(){if(hl){hl.setMap(null);hl=null;}if(pop){pop.setMap(null);pop=null;}}
function onTap(ll){
  if(Date.now()-shapeHit<400)return;
  if(!document.getElementById('tsheet').hidden){document.getElementById('tCancel').click();return;}
  if(sbar.classList.contains('open')){openSearch(false);return;}
  if(!menu.hidden){showMenu(false);return;}
  if(tool){toolTap(ll);return;}
  clearSel();
  const lat=ll.getLat(),lng=ll.getLng(),b=buildingAt(lat,lng);
  const path=b?b.path:null;
  if(path){hl=new kakao.maps.Polygon({map,path:path.map(p=>new kakao.maps.LatLng(p[0],p[1])),strokeWeight:3,strokeColor:'#1f4fd1',strokeOpacity:1,fillColor:'#1f4fd1',fillOpacity:.25,zIndex:4});}
  else{hl=new kakao.maps.Circle({map,center:ll,radius:6,strokeWeight:3,strokeColor:'#1f4fd1',fillColor:'#1f4fd1',fillOpacity:.25,zIndex:4});}
  const at=path?center(path):[lat,lng];
  geocoder.coord2Address(lng,lat,(r,st)=>{
    if(st!==kakao.maps.services.Status.OK||!r[0]){showPop(at,{nw:'',old:'Адрес не найден',bld:'',path});return;}
    const ra=r[0].road_address,ad=r[0].address;
    showPop(at,{nw:ra?short(ra.address_name):'',bld:ra&&ra.building_name||'',old:ad?short(ad.address_name):'',path});
  });
}
function keyOf(info){return info.old||info.nw||('pt:'+(info.path?center(info.path).join(','):''));}
function showPop(at,info,open){
  if(pop)pop.setMap(null);
  const k=keyOf(info),rec=notes[k],list=rec?rec.notes:[];
  const el=document.createElement('div');el.className='pop';
  el.innerHTML=`<button class="x" aria-label="Закрыть">✕</button>
   <button class="head" aria-expanded="${!!open}">
     ${info.nw?`<div class="new"><span class="lbl n">도로명</span>${esc(info.nw)}${info.bld?` <span class="bld">${esc(info.bld)}</span>`:''}</div>`:''}
     <div class="old"><span class="lbl o">지번</span>${esc(info.old||'—')}</div>
     <div class="more">${open?'Свернуть ▲':(list.length?`Заметки: ${list.length} ▼`:'Добавить заметку ▼')}</div>
   </button>
   ${open?`<div class="body"><div class="notes">${list.length?list.map((n,i)=>`<div class="note"><div class="t">${esc(n.t)}</div><div class="d">${new Date(n.at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><button data-i="${i}" aria-label="Удалить заметку">✕</button></div>`).join(''):'<div class="empty">Заметок пока нет.</div>'}</div>
     <textarea id="nt" placeholder="Например: код двери 1234#, оставлять у охраны"></textarea>
     <button class="add">Сохранить</button></div>`:''}`;
  ['click','mousedown','touchstart','touchend','dblclick','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation()));
  el.querySelector('.x').onclick=clearSel;
  el.querySelector('.head').onclick=()=>showPop(at,info,!open);
  if(open){
    el.querySelector('.add').onclick=()=>{const t=el.querySelector('#nt').value.trim();if(!t)return;
      notes[k]=notes[k]||{nw:info.nw,old:info.old,bld:info.bld,path:info.path,at,notes:[]};notes[k].notes.push({t,at:Date.now()});store.set(NOTES_KEY,notes);drawNoted();showPop(at,info,true);};
    el.querySelectorAll('.note button').forEach(b=>b.onclick=()=>{notes[k].notes.splice(+b.dataset.i,1);if(!notes[k].notes.length)delete notes[k];store.set(NOTES_KEY,notes);drawNoted();showPop(at,info,true);});
  }
  pop=new kakao.maps.CustomOverlay({map,position:new kakao.maps.LatLng(at[0],at[1]),content:el,yAnchor:1,zIndex:10,clickable:true});
  if(open){const pt=map.getProjection().containerPointFromCoords(new kakao.maps.LatLng(at[0],at[1]));if(pt.y<330)map.panBy(0,pt.y-330);}
}

// ---------- search (hidden behind the tab) ----------
const AREA_C=[35.2075,129.0065],AREA_R=1500;   // search radius around the territory
const tab=document.getElementById('tab'),sbar=document.getElementById('sbar'),sq=document.getElementById('sq'),sugg=document.getElementById('sugg');
function openSearch(on){sbar.classList.toggle('open',on);tab.style.opacity=on?0:1;tab.style.pointerEvents=on?'none':'';tab.setAttribute('aria-expanded',on);
  if(on)setTimeout(()=>sq.focus(),200);else{sq.blur();sugg.innerHTML='';}}
tab.onclick=()=>openSearch(true);
document.getElementById('sclose').onclick=()=>{sq.value='';openSearch(false);};
let sTimer,sSeq=0,sItems=[];
sq.addEventListener('input',()=>{clearTimeout(sTimer);sTimer=setTimeout(runSearch,250);});
sq.addEventListener('keydown',e=>{if(e.key==='Enter'&&sItems[0]){e.preventDefault();pick(sItems[0]);}if(e.key==='Escape')openSearch(false);});
const inArea=(lat,lng,addr)=>{if(D.zone.length>2)return inPoly(lat,lng,D.zone);const d=Math.hypot((lat-AREA_C[0])*111000,(lng-AREA_C[1])*91000);return d<=AREA_R&&(!addr||/구포|북구/.test(addr));};
function runSearch(){
  const q=sq.value.trim(),seq=++sSeq;if(!q){sugg.innerHTML='';sItems=[];return;}
  if(!map)return;
  const out=[],seen=new Set(),push=it=>{const k=it.lat.toFixed(5)+','+it.lng.toFixed(5);if(seen.has(k))return;seen.add(k);out.push(it);};
  const ql=q.toLowerCase();
  Object.values(notes).forEach(r=>{const hay=(r.nw+' '+r.old+' '+(r.bld||'')+' '+r.notes.map(n=>n.t).join(' ')).toLowerCase();
    if(hay.includes(ql))push({nm:r.bld||r.nw||r.old,ad:[r.nw,r.old].filter(Boolean).join(' · '),lat:r.at[0],lng:r.at[1],noted:true});});
  const S=kakao.maps.services,loc=new kakao.maps.LatLng(AREA_C[0],AREA_C[1]);let left=2;
  const fin=()=>{if(--left||seq!==sSeq)return;sItems=out.slice(0,12);render();};
  geocoder.addressSearch('부산 북구 '+q,(r,st)=>{if(st===S.Status.OK)r.forEach(a=>{const lat=+a.y,lng=+a.x;if(!inArea(lat,lng,a.address_name))return;
      const ra=a.road_address,ad=a.address;push({nm:ra?short(ra.address_name)+(ra.building_name?' '+ra.building_name:''):short(a.address_name),ad:ad?'지번 '+short(ad.address_name):'',lat,lng});});fin();},{size:10});
  new S.Places().keywordSearch(q,(r,st)=>{if(st===S.Status.OK)r.forEach(p=>{const lat=+p.y,lng=+p.x;if(!inArea(lat,lng,p.address_name))return;
      push({nm:p.place_name,ad:short(p.road_address_name||p.address_name),lat,lng});});fin();},{location:loc,radius:AREA_R,sort:S.SortBy.DISTANCE});
}
function render(){
  sugg.innerHTML=sItems.length?sItems.map((it,i)=>`<li data-i="${i}"><div class="nm">${esc(it.nm)}${it.noted?'<span class="tag">заметка</span>':''}</div>${it.ad?`<div class="ad">${esc(it.ad)}</div>`:''}</li>`).join(''):'<li class="none">На участке ничего не найдено</li>';
  sugg.querySelectorAll('li[data-i]').forEach(li=>li.onclick=()=>pick(sItems[+li.dataset.i]));
}
async function pick(it){
  openSearch(false);const ll=new kakao.maps.LatLng(it.lat,it.lng);
  map.setLevel(2);map.setCenter(ll);
  try{await loadVisible();}catch(e){}
  if(tool)setTool(null);showMenu(false);onTap(ll);
}

function styleRow(box,obj,onChange){
  const paint=()=>{box.innerHTML=`<div class="sws">${COLORS.map(c=>`<button class="sw${c===obj.c?' on':''}" data-c="${c}" style="background:${c}" aria-label="Цвет"></button>`).join('')}</div>
   <label>Прозрачность<input type="range" min="10" max="100" step="5" value="${Math.round(A(obj)*100)}" aria-label="Прозрачность"><b>${Math.round(A(obj)*100)}%</b><span class="pv" style="background:${obj.c};opacity:${A(obj)}"></span></label>`;
    box.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{obj.c=s.dataset.c;paint();onChange();});

function bar(hint,btns,styleObj){$('toolbar').hidden=!hint;$('tHint').textContent=hint||'';$('tBtns').innerHTML='';

function setTool(tl){
  tool=tl;sel=null;if(map)map.setZoomable(true);showMenu(false);clearSel();closeSheet();arrowStart=null;if(arrowTmp){arrowTmp.setMap(null);arrowTmp=null;}

function zoneBar(){bar(`Наведи крестик на угол границы и нажми «Поставить точку». Точки можно двигать пальцем. Точек: ${D.zone.length}`,
  [['Поставить точку','pri',()=>{const c=map.getCenter();D.zone.push([+c.getLat().toFixed(6),+c.getLng().toFixed(6)]);undoStack.push({zonePop:1});saveD();drawAll();zoneBar();}],
   ['Убрать точку','',()=>{D.zone.pop();saveD();drawAll();zoneBar();}],
   ['Готово','',()=>setTool(null)],
   ...(D.zone.length?[['Стереть','danger',function(){if(this.dataset.sure){undoStack.push({zone:D.zone});D.zone=[];saveD();drawAll();zoneBar();}else{this.dataset.sure=1;this.textContent='Точно стереть?';}}]]:[])],D.tools.zone);}
function undo(){const u=undoStack.pop();if(!u)return;
  if(u.label)D.labels=D.labels.filter(l=>l!==u.label);if(u.arrow)D.arrows=D.arrows.filter(a=>a!==u.arrow);
  if(u.labels){D.labels=u.labels;D.arrows=u.arrows;}if(u.moveLabel)u.moveLabel.p=u.p;if(u.relabel)D.labels.push(u.relabel);if(u.rearrow)D.arrows.push(u.rearrow);if(u.resize){if(u.resize.t!=null)u.resize.s=u.v;else u.resize.w=u.v;}if(u.moveArrow){u.moveArrow.a=u.a;u.moveArrow.b=u.b;}if(u.zonePop)D.zone.pop();if(u.zone)D.zone=u.zone;
  saveD();drawAll();if(tool==='zone')zoneBar();}

function editBar(){
  if(!sel){bar('Режим редактирования. Нажми на надпись или стрелку, чтобы выбрать её.',[['Готово','pri',()=>setTool(null)]]);return;}
  const o=sel.obj,isL=sel.kind==='label';
  const proxy=isL?o:{get c(){return o.c},set c(v){o.c=v},get a(){return o.o==null?1:o.o},set a(v){o.o=v}};
  bar(isL?'Тяни — переместить. Двумя пальцами — размер.':'Тяни за середину — переместить, за конец — повернуть. Двумя пальцами — толщина.',
   [...(isL?[['Текст','',()=>openSheet('label',o,false)]]:[]),
    ['Удалить','danger',()=>{if(isL)D.labels=D.labels.filter(x=>x!==o);else D.arrows=D.arrows.filter(x=>x!==o);undoStack.push(isL?{relabel:o}:{rearrow:o});select(null);saveD();drawAll();}],
    ['Снять выбор','',()=>select(null)],['Готово','pri',()=>setTool(null)]],proxy);
  $('tStyle').hidden=false;styleRow($('tStyle'),proxy,()=>{saveD();drawAll();});
}
function select(s){sel=s;if(map)map.setZoomable(!s);drawAll();editBar();}
function toolTap(ll){
  const p=[+ll.getLat().toFixed(6),+ll.getLng().toFixed(6)];
  if(tool==='edit'){const q=map.getProjection().containerPointFromCoords(ll),h=findArrowAt([q.x,q.y]);select(h?{kind:'arrow',obj:h.obj}:null);return;}

  }
  else if(tool==='zone'){D.zone.push(p);undoStack.push({zonePop:1});saveD();drawAll();zoneBar();}
}

// bottom sheet: edit a label (text + colour + opacity) or an arrow (colour + opacity)

const vtxImg=()=>new kakao.maps.MarkerImage('data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="8" fill="#fff" stroke="'+D.tools.zone.c+'" stroke-width="4"/></svg>'),new kakao.maps.Size(26,26),{offset:new kakao.maps.Point(13,13)});
function drawAll(){
  if(!map)return;drawn.forEach(o=>o.setMap(null));drawn=[];vtx.forEach(m=>m.setMap(null));vtx=[];if(zoneShape){zoneShape.setMap(null);zoneShape=null;}
  const L=p=>new kakao.maps.LatLng(p[0],p[1]),z=D.tools.zone;
  if(D.zone.length>1)zoneShape=new kakao.maps.Polygon({map,path:D.zone.map(L),strokeWeight:4,strokeColor:z.c,strokeStyle:'dash',strokeOpacity:.95*A(z),fillColor:z.c,fillOpacity:(tool==='zone'?.08:.04)*A(z),zIndex:2});
  if(tool==='zone')D.zone.forEach((p,i)=>{const m=new kakao.maps.Marker({map,position:L(p),draggable:true,image:vtxImg(),zIndex:7});
    kakao.maps.event.addListener(m,'dragend',()=>{const q=m.getPosition();D.zone[i]=[+q.getLat().toFixed(6),+q.getLng().toFixed(6)];saveD();drawAll();});vtx.push(m);});
  if(D.hidden)return;
  D.arrows.forEach(a=>{const o=a.o==null?1:a.o,w=a.w||5,path=[L(a.a),L(a.b)],ls=[];
    if(sel&&sel.obj===a)ls.push(new kakao.maps.Polyline({map,path,strokeWeight:w+10,strokeColor:'#1f4fd1',strokeOpacity:.45,zIndex:4}));
    ls.push(new kakao.maps.Polyline({map,path,strokeWeight:w,strokeColor:a.c,strokeOpacity:.95*o,endArrow:true,zIndex:5}));
    lineOf.set(a,ls);drawn.push(...ls);});
  D.labels.forEach(l=>{const el=document.createElement('div');el.className='lab';el.style.setProperty('--bg',l.c);el.style.color=l.c==='#ffffff'?'#18212b':'#fff';labOf.set(el,l);el.style.opacity=A(l);el.style.fontSize=(14*(l.s||1)).toFixed(1)+'px';el.textContent=l.t;
    if(tool!=='edit')el.classList.add('off');if(sel&&sel.obj===l)el.classList.add('sel');
    ['mousedown','touchstart','touchend','dblclick'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation()));
    el.addEventListener('click',e=>{e.stopPropagation();if(Date.now()-shapeHit<400||tool!=='edit')return;shapeHit=Date.now();select({kind:'label',obj:l});});
    const ov=new kakao.maps.CustomOverlay({map,position:L(l.p),content:el,xAnchor:.5,yAnchor:1,zIndex:6,clickable:true});ovOf.set(l,ov);drawn.push(ov);});

// ---------- gestures: edit mode (select / move / pinch-resize) and long-press on a house in normal mode ----------
const mapEl=document.getElementById('map');
const evPt=e=>{const r=mapEl.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const toLLpx=([x,y])=>map.getProjection().coordsFromContainerPoint(new kakao.maps.Point(x,y));
const toPx=p=>{const q=map.getProjection().containerPointFromCoords(new kakao.maps.LatLng(p[0],p[1]));return[q.x,q.y];};
function segDist(P,A,B){const dx=B[0]-A[0],dy=B[1]-A[1],l=dx*dx+dy*dy||1;let u=((P[0]-A[0])*dx+(P[1]-A[1])*dy)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(P[0]-A[0]-u*dx,P[1]-A[1]-u*dy);}
function findArrowAt(P){if(D.hidden)return null;let best=null,bd=18;
  D.arrows.forEach(a=>{const A=toPx(a.a),B=toPx(a.b),d=segDist(P,A,B)-(a.w||5)/2;if(d<bd){bd=d;
    const part=Math.hypot(P[0]-B[0],P[1]-B[1])<28?'b':Math.hypot(P[0]-A[0],P[1]-A[1])<28?'a':'all';best={obj:a,part};}});return best;}
(function(){
  let st=null,pinch=null;const r6=v=>+v.toFixed(6);
  function down(e){
    if(!map||e.button>0||!e.isPrimary||!document.getElementById('tsheet').hidden)return;
    if(e.target.closest&&e.target.closest('.pop'))return;
    const P=evPt(e);
    if(!tool){ // normal mode: press & hold a house = select it
      st={kind:'house',x:P[0],y:P[1],timer:setTimeout(()=>{const ll=toLLpx(P);st=null;shapeHit=0;onTap(ll);shapeHit=Date.now();if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}},500)};return;}
    if(tool!=='edit')return;
    const labEl=e.target.closest&&e.target.closest('.lab');let hit=null;
    if(labEl&&labOf.has(labEl))hit={kind:'label',obj:labOf.get(labEl)};
    else{const a=findArrowAt(P);if(a)hit={kind:'arrow',obj:a.obj,part:a.part};}
    if(!hit)return;
    st={...hit,x:P[0],y:P[1],dragging:false};
    if(sel&&sel.obj===hit.obj)start();            // already selected: move right away
    else st.timer=setTimeout(start,400);          // otherwise press & hold
  }
  function start(){
    if(!st)return;if(!sel||sel.obj!==st.obj)select({kind:st.kind,obj:st.obj});
    st.dragging=true;map.setDraggable(false);mapEl.classList.add('dragging');
    if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
    const o=st.obj;
    if(st.kind==='label'){st.orig={p:[...o.p]};st.P0=toPx(o.p);}
    else{st.orig={a:[...o.a],b:[...o.b]};st.A=toPx(o.a);st.B=toPx(o.b);}
    document.querySelectorAll('.lab.sel').forEach(x=>x.classList.add('lift'));
  }
  function move(e){
    if(!st||pinch)return;const P=evPt(e);
    if(!st.dragging){if(Math.hypot(P[0]-st.x,P[1]-st.y)>8){clearTimeout(st.timer);st=null;}return;}
    e.preventDefault();e.stopPropagation();
    const dx=P[0]-st.x,dy=P[1]-st.y,o=st.obj,mv=S=>{const ll=toLLpx([S[0]+dx,S[1]+dy]);return[r6(ll.getLat()),r6(ll.getLng())];};
    if(st.kind==='label'){o.p=mv(st.P0);ovOf.get(o)?.setPosition(new kakao.maps.LatLng(o.p[0],o.p[1]));}
    else{if(st.part!=='b')o.a=mv(st.A);if(st.part!=='a')o.b=mv(st.B);
      const path=[new kakao.maps.LatLng(o.a[0],o.a[1]),new kakao.maps.LatLng(o.b[0],o.b[1])];(lineOf.get(o)||[]).forEach(l=>l.setPath(path));}
  }
  function up(){
    if(!st)return;clearTimeout(st.timer);
    if(st.dragging){shapeHit=Date.now();map.setDraggable(true);mapEl.classList.remove('dragging');
      document.querySelectorAll('.lab.lift').forEach(x=>x.classList.remove('lift'));
      undoStack.push(st.kind==='label'?{moveLabel:st.obj,p:st.orig.p}:{moveArrow:st.obj,...st.orig});saveD();}
    st=null;
  }
  // two fingers: resize the selected object (map zoom is off while something is selected)
  function tstart(e){
    if(e.touches.length>1&&st&&!st.dragging){clearTimeout(st.timer);st=null;}
    if(tool!=='edit'||!sel||e.touches.length!==2)return;
    if(st){clearTimeout(st.timer);if(st.dragging){map.setDraggable(true);mapEl.classList.remove('dragging');}st=null;}
    const [a,b]=e.touches,o=sel.obj;
    pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,v0:sel.kind==='label'?(o.s||1):(o.w||5)};
    e.preventDefault();e.stopPropagation();
  }
  function tmove(e){
    if(pinch&&e.touches.length===2){e.preventDefault();e.stopPropagation();
      const [a,b]=e.touches,k=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d0;resizeSel(pinch.v0*k,false);return;}
    if(st&&st.dragging){e.preventDefault();e.stopPropagation();}
  }
  function tend(e){if(pinch&&e.touches.length<2){undoStack.push({resize:sel.obj,v:pinch.v0});pinch=null;saveD();}}
  mapEl.addEventListener('pointerdown',down,true);
  window.addEventListener('pointermove',move,{capture:true,passive:false});
  window.addEventListener('pointerup',up,true);window.addEventListener('pointercancel',up,true);
  mapEl.addEventListener('touchstart',tstart,{capture:true,passive:false});
  mapEl.addEventListener('touchmove',tmove,{capture:true,passive:false});
  mapEl.addEventListener('touchend',tend,true);mapEl.addEventListener('touchcancel',tend,true);
  mapEl.addEventListener('mousemove',e=>{if(st&&st.dragging){e.preventDefault();e.stopPropagation();}},true);
  // mouse wheel on a computer = resize the selected object
  mapEl.addEventListener('wheel',e=>{if(tool!=='edit'||!sel)return;e.preventDefault();e.stopPropagation();
    const o=sel.obj,v=sel.kind==='label'?(o.s||1):(o.w||5);resizeSel(v*(e.deltaY<0?1.1:1/1.1),true);},{capture:true,passive:false});
  mapEl.addEventListener('contextmenu',e=>{if(st)e.preventDefault();});
})();
function resizeSel(v,commit){
  if(!sel)return;const o=sel.obj;
  if(sel.kind==='label'){o.s=+Math.max(.6,Math.min(3.5,v)).toFixed(2);    document.querySelectorAll('.lab.sel').forEach(x=>x.style.fontSize=(14*o.s).toFixed(1)+'px');}
  else{o.w=+Math.max(2,Math.min(24,v)).toFixed(1);const ls=lineOf.get(o)||[];
    if(ls.length===2){ls[0].setOptions({strokeWeight:o.w+10});ls[1].setOptions({strokeWeight:o.w});}else ls.forEach(l=>l.setOptions({strokeWeight:o.w}));}
  if(commit)saveD();
}

// ---------- houses with notes are tinted orange ----------
function drawNoted(){
  if(!map)return;noteShapes.forEach(s=>s.setMap(null));noteShapes=[];
  Object.values(notes).forEach(r=>{
    const o={map,strokeWeight:2,strokeColor:'#e8590c',fillColor:'#e8590c',fillOpacity:.3,zIndex:3};
    noteShapes.push(r.path?new kakao.maps.Polygon({...o,path:r.path.map(p=>new kakao.maps.LatLng(p[0],p[1]))})
      :new kakao.maps.Circle({...o,center:new kakao.maps.LatLng(r.at[0],r.at[1]),radius:6}));
  });
}
</script>
