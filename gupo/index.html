<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Участок Гупо-дон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Black+Han+Sans&family=Nanum+Pen+Script&family=Jua&display=swap">
<style>
/* Layout: full-screen KakaoMap; floating translucent "islands" slide in from the screen edges */
:root{
  --glass:rgba(255,255,255,.76);--glass2:rgba(255,255,255,.88);--ink:#18212b;--muted:#5b6672;--line:rgba(24,33,43,.12);
  --accent:#1f4fd1;--accentG:rgba(31,79,209,.9);--note:#e8590c;--danger:#c92a2a;
  --ease:cubic-bezier(.2,.85,.25,1);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#eef1f4;overflow:hidden}
body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0}
#map.dragging{cursor:grabbing}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(5px) saturate(1.2);backdrop-filter:blur(5px) saturate(1.2);box-shadow:0 4px 18px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.5) inset}
/* every island slides out past the screen edge when hidden */
.isl{position:fixed;z-index:20;transition:transform .42s var(--ease),opacity .3s ease}
.isl.out-b{transform:translate(-50%,calc(100% + 40px + var(--sb)));opacity:0;pointer-events:none}
.isl.out-r{transform:translateX(calc(100% + 40px + var(--sr)));opacity:0;pointer-events:none}
.isl.out-l{transform:translateX(calc(-100% - 40px - var(--sl)));opacity:0;pointer-events:none}
.isl.out-t{transform:translate(-50%,calc(-100% - 40px - var(--st)));opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.isl{transition:opacity .2s}}

#msg{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);max-width:calc(100vw - 110px);z-index:25;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:10px;transition:opacity .3s}
#msg.err{color:var(--danger)}
#msg.hide{opacity:0;pointer-events:none}

/* bottom island: account + edit */
#mainIsl{left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px}
#mainIsl button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer}
#mainIsl button:hover{background:rgba(24,33,43,.06)}
#mainIsl svg{width:21px;height:21px}
#mainIsl .sep{width:1px;background:var(--line);margin:8px 0}

/* round close button */
#closeBtn{left:50%;bottom:calc(var(--sb) + 18px);transform:translateX(-50%);width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center}
#closeBtn svg{width:24px;height:24px}

/* tool island (vertical, lower right) */
#toolIsl{right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + 92px);display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:28px}
.tb{width:48px;height:48px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;position:relative}
.tb svg{width:24px;height:24px}
.tb:hover{background:rgba(24,33,43,.06)}
.tb.on{background:var(--accentG);color:#fff}
.tb .cdot{position:absolute;right:7px;bottom:7px;width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.tb .tag{position:absolute;right:4px;top:4px;font-size:9px;font-weight:800;line-height:1}

/* flyout panel to the left of the tool island */
#fly{right:calc(var(--sr) + 82px);bottom:calc(var(--sb) + 92px);width:min(300px,calc(100vw - 104px - var(--sr) - var(--sl)));max-height:calc(100vh - var(--st) - var(--sb) - 290px);overflow:auto;padding:12px;border-radius:18px;display:flex;flex-direction:column;gap:10px}
#fly h3{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:12px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);min-height:70px;justify-content:center}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:rgba(31,79,209,.07)}
.opt svg{width:52px;height:30px}
.row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.row b{min-width:40px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--accentG);border-color:transparent;color:#fff}
.fonts{display:flex;flex-direction:column;gap:6px}
.fonts button{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;font-size:17px}
.fonts button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.wheelBox{position:relative;width:200px;height:200px;align-self:center;touch-action:none}
.wheelBox canvas{width:200px;height:200px;border-radius:50%;display:block;cursor:crosshair}
.wheelBox .knob{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35);pointer-events:none}
.prev{height:26px;border-radius:8px;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,6px 6px;overflow:hidden}
.prev i{display:block;height:100%}
.target{font-size:12.5px;color:var(--muted)}

/* undo / redo, top-left */
#histIsl{left:calc(var(--sl) + 12px);top:calc(var(--st) + 12px);display:flex;gap:2px;padding:4px;border-radius:999px}
#histIsl button{width:44px;height:44px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
#histIsl button:disabled{opacity:.3;cursor:default}
#histIsl svg{width:22px;height:22px}

/* context island (hints + actions), top */
#ctxIsl{left:50%;top:calc(var(--st) + 68px);transform:translateX(-50%);width:min(440px,calc(100vw - 24px));padding:10px 12px;border-radius:16px;display:flex;flex-direction:column;gap:8px}
#ctxHint{font-size:13px;color:var(--muted)}
#ctxBtns{display:flex;gap:6px;flex-wrap:wrap}
#ctxBtns:empty{display:none}
#ctxBtns button{border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:13.5px}
#ctxBtns button.pri{background:var(--accentG);border-color:transparent;color:#fff;font-weight:600}
#ctxBtns button.danger{color:var(--danger)}

#cross{position:fixed;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:15;pointer-events:none}
#cross[hidden]{display:none}

/* bottom sheets: text entry, account */
.sheet{left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100vw);border-radius:18px 18px 0 0;padding:14px max(16px,var(--sr)) calc(14px + var(--sb)) max(16px,var(--sl));display:flex;flex-direction:column;gap:10px;z-index:30}
.sheet h4{margin:0;font-size:14px}
.sheet input,.sheet textarea{font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:10px;background:rgba(255,255,255,.8);width:100%}
.sheet .two{display:flex;gap:8px;align-items:center}
.sheet .two span{color:var(--muted)}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .acts button{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px}
.sheet .acts button.pri{background:var(--accentG);border-color:transparent;color:#fff;font-weight:600}
.sheet .acts button.danger{color:var(--danger);margin-right:auto}
.sheet p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.45}

/* search tab + bar (top right) */
#tab{right:0;top:calc(var(--st) + 14px);width:34px;height:64px;border:0;border-radius:14px 0 0 14px;background:rgba(60,52,58,.82);color:#f1e9ee;cursor:pointer;display:grid;place-items:center}
#tab svg{width:14px;height:24px}
#sbar{position:fixed;left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);top:calc(var(--st) + 10px);z-index:26;transform:translateX(calc(100% + 24px));transition:transform .35s var(--ease);pointer-events:none}
#sbar.open{transform:none;pointer-events:auto}
.sbox{display:flex;align-items:center;gap:4px;border-radius:14px;padding:4px 4px 4px 12px;background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.22)}
.sbox input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;padding:9px 0;background:none;color:var(--ink)}
.sbox button{width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;border-radius:8px}
#sugg{list-style:none;margin:6px 0 0;padding:4px 0;border-radius:14px;max-height:50vh;overflow:auto;background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.2)}
#sugg:empty{display:none}
#sugg li{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
#sugg li:last-child{border-bottom:0}
#sugg li:hover{background:rgba(31,79,209,.08)}
#sugg .nm{font-weight:600}
#sugg .ad{font-size:12.5px;color:var(--muted);margin-top:2px}
#sugg .tg{font-size:10.5px;font-weight:700;color:var(--note);margin-left:6px}
#sugg li.none{color:var(--muted);cursor:default;background:none}

/* house popup */
.pop{position:relative;width:min(300px,calc(100vw - 40px));border-radius:14px;margin-bottom:14px;font-size:14px;background:var(--glass2);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pop:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--glass2)}
.pop .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer}
.head{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 40px 10px 14px;cursor:pointer}
.head .new{font-weight:700;font-size:15px;line-height:1.3}
.head .bld{font-weight:400;color:var(--muted)}
.head .old{color:var(--muted);font-size:13px;margin-top:3px}
.head .more{color:var(--accent);font-size:12.5px;margin-top:6px}
.lbl{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.lbl.n{background:#e7edff;color:#1f4fd1}.lbl.o{background:#eef0f2;color:#5b6672}
.pbody{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.notes{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto}
.note{background:rgba(255,246,238,.75);border:1px solid #ffd8bd;border-radius:8px;padding:7px 9px;display:grid;grid-template-columns:1fr auto;gap:4px}
.note .t{white-space:pre-wrap;word-break:break-word}
.note .d{grid-column:1/2;font-size:11px;color:var(--muted)}
.note button{grid-row:1/3;grid-column:2;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer}
.empty{color:var(--muted);font-size:13px}
.pop textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:none;min-height:56px;width:100%;background:rgba(255,255,255,.7)}
.add{align-self:flex-end;border:0;background:var(--accentG);color:#fff;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer}

/* shapes with text on the map */
.shp{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;padding:.32em .75em;white-space:pre;font-size:14px;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.28);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .12s;pointer-events:none}
.edit .shp{pointer-events:auto;cursor:pointer}
.shp.rect{border-radius:3px}
.shp.round{border-radius:.7em}
.shp.pill{border-radius:999px;padding:.32em 1em}
.shp.ellipse{border-radius:50%;padding:.7em 1.2em}
.shp.pin{border-radius:.7em;margin-bottom:9px}
.shp.pin:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top:9px solid var(--bg)}
.shp.flag{border-radius:3px 3px 3px 0;margin-bottom:22px}
.shp.flag:after{content:"";position:absolute;left:0;bottom:-22px;width:3px;height:22px;background:var(--bg)}
.shp.vert{writing-mode:vertical-rl;text-orientation:upright;padding:.75em .32em}
.shp.sel{outline:3px solid #fff;box-shadow:0 0 0 6px rgba(31,79,209,.85),0 4px 12px rgba(0,0,0,.35)}
.shp.lift{transform:translateY(-4px) scale(1.06)}
.numb{min-width:24px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font:800 12.5px system-ui,sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>
<div id="msg" class="glass hide"></div>
<div id="cross" hidden><svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="9" fill="none" stroke="#fff" stroke-width="5"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="22" cy="22" r="9" fill="none" stroke="#c92a2a" stroke-width="2.5"/><path d="M22 2v12M22 30v12M2 22h12M30 22h12" stroke="#c92a2a" stroke-width="2.5" stroke-linecap="round"/><circle cx="22" cy="22" r="1.8" fill="#c92a2a"/></svg></div>

<!-- search -->
<button id="tab" class="isl" aria-label="Открыть поиск" aria-expanded="false"><svg viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 3 12l8 9"/></svg></button>
<div id="sbar" role="search">
  <div class="sbox"><input id="sq" type="search" placeholder="Адрес, дом или место" autocomplete="off" enterkeyhint="search" aria-label="Поиск"><button id="sclose" aria-label="Закрыть поиск">✕</button></div>
  <ul id="sugg"></ul>
</div>

<!-- normal mode: bottom island -->
<div id="mainIsl" class="isl glass">
  <button id="bAcc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Аккаунт</button>
  <span class="sep"></span>
  <button id="bEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>Рисовать</button>
</div>

<!-- edit mode -->
<button id="closeBtn" class="isl glass out-b" aria-label="Закрыть редактирование"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<div id="toolIsl" class="isl glass out-r" role="toolbar" aria-label="Инструменты">
  <button class="tb" id="tZone" aria-label="Граница участка" title="Граница участка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="3 2.4"><path d="M4 7 11 3l9 5-2 11-12 2z"/></svg></button>
  <button class="tb" id="tShape" aria-label="Фигуры с текстом" title="Фигуры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="11" height="8" rx="2.5"/><circle cx="16.5" cy="16.5" r="4.5"/></svg></button>
  <button class="tb" id="tArrow" aria-label="Стрелки" title="Стрелки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5M10 5h9v9"/></svg></button>
  <button class="tb" id="tFont" aria-label="Шрифт" title="Шрифт"><svg viewBox="0 0 24 24" fill="currentColor"><text x="3" y="18" font-size="16" font-weight="700" font-family="Georgia,serif">A</text><text x="13" y="18" font-size="11" font-family="system-ui">a</text></svg></button>
  <button class="tb" id="tColor" aria-label="Цвет и прозрачность" title="Цвет"><svg viewBox="0 0 24 24"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#ff4d4d"/><stop offset=".33" stop-color="#ffd43b"/><stop offset=".66" stop-color="#40c057"/><stop offset="1" stop-color="#4c6ef5"/></linearGradient></defs><circle cx="12" cy="12" r="9" fill="url(#g1)"/></svg><b class="cdot" id="cDot"></b></button>
</div>
<div id="fly" class="isl glass out-r"></div>
<div id="histIsl" class="isl glass out-l">
  <button id="hUndo" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button id="hRedo" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
</div>
<div id="ctxIsl" class="isl glass out-t"><div id="ctxHint"></div><div id="ctxBtns"></div></div>

<!-- sheets -->
<div id="txtSheet" class="isl glass sheet out-b">
  <h4 id="txtTitle">Текст</h4>
  <textarea id="txtIn" rows="2" placeholder="Текст или цифры" maxlength="80"></textarea>
  <div class="two" id="numRow"><input id="n1" inputmode="numeric" placeholder="от" aria-label="От"><span>→</span><input id="n2" inputmode="numeric" placeholder="до" aria-label="До"></div>
  <div class="acts"><button class="danger" id="txtDel">Удалить</button><button id="txtCancel">Отмена</button><button class="pri" id="txtOk">Готово</button></div>
</div>
<div id="accSheet" class="isl glass sheet out-b">
  <h4>Аккаунт</h4>
  <p>Вход и общий доступ для нескольких телефонов появятся позже. Сейчас заметки и рисунки хранятся только на этом телефоне. Сохрани копию, чтобы не потерять их или перенести на другой телефон.</p>
  <div class="acts">
    <button class="danger" id="accClear">Удалить все рисунки</button>
    <button id="accImp">Загрузить копию</button>
    <button class="pri" id="accExp">Сохранить копию</button>
  </div>
  <div class="acts"><button id="accClose">Закрыть</button></div>
  <input type="file" id="impFile" accept="application/json,.json" hidden>
</div>

<script>
const APPKEY='53f83a531954055ca29efd3e8a0d1a45';
const NOTES_KEY='gupo-notes-v1',BLD_KEY='gupo-bld-v1:',DRAW_KEY='gupo-draw-v2';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short=a=>(a||'').replace(/^부산(광역시)?\s+북구\s+/,'');
const r6=v=>+(+v).toFixed(6);
let msgT;function msg(t,err,ms){const m=$('msg');m.textContent=t;m.className='glass'+(err?' err':'');clearTimeout(msgT);if(ms)msgT=setTimeout(()=>m.classList.add('hide'),ms);}
const show=(el,on,dir)=>el.classList.toggle('out-'+dir,!on);

const s=document.createElement('script');

let map,geocoder,hl=null,pop=null,noteShapes=[];

const buildings=new Map(),tilesDone=new Set(),tilesLoading=new Set();

/* =================== building outlines (OpenStreetMap, cached per ~550 m tile) =================== */
const TL=0.005;
function tileKeys(b){const sw=b.getSouthWest(),ne=b.getNorthEast(),ks=[];
  for(let y=Math.floor(sw.getLat()/TL);y<=Math.floor(ne.getLat()/TL);y++)for(let x=Math.floor(sw.getLng()/TL);x<=Math.floor(ne.getLng()/TL);x++)ks.push(y+'_'+x);return ks;}
function addWays(ways){ways.forEach(w=>{if(buildings.has(w.id))return;let a=90,b=180,c=-90,d=-180;
  w.g.forEach(([la,ln])=>{a=Math.min(a,la);b=Math.min(b,ln);c=Math.max(c,la);d=Math.max(d,ln);});buildings.set(w.id,{path:w.g,bb:[a,b,c,d]});});}
async function fetchTile(k){
  const cached=store.get(BLD_KEY+k,null);
  if(cached&&Date.now()-cached.at<30*864e5){addWays(cached.w);tilesDone.add(k);return;}
  const [y,x]=k.split('_').map(Number),bbox=[y*TL,x*TL,(y+1)*TL,(x+1)*TL].map(v=>v.toFixed(4)).join(',');
  const q=`[out:json][timeout:25];way["building"](${bbox});out geom;`;
  for(const ep of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){
    try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      if(!r.ok)continue;const j=await r.json();
      const w=j.elements.filter(e=>e.geometry).map(e=>({id:e.id,g:e.geometry.map(p=>[r6(p.lat),r6(p.lon)])}));
      addWays(w);store.set(BLD_KEY+k,{at:Date.now(),w});tilesDone.add(k);return;}catch(e){}
  }
  throw new Error('osm');
}
async function loadVisible(){
  if(map.getLevel()>4)return;
  const ks=tileKeys(map.getBounds()).filter(k=>!tilesDone.has(k)&&!tilesLoading.has(k));
  if(!ks.length)return;ks.forEach(k=>tilesLoading.add(k));
  const r=await Promise.allSettled(ks.map(fetchTile));ks.forEach(k=>tilesLoading.delete(k));
  if(r.some(x=>x.status==='rejected'))msg('Контуры домов загрузились не везде. Дом всё равно можно выбрать, просто без контура.',true,5000);
}
function inPoly(lat,lng,path){let ins=false;for(let i=0,j=path.length-1;i<path.length;j=i++){const [yi,xi]=path[i],[yj,xj]=path[j];
  if((yi>lat)!==(yj>lat)&&lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function buildingAt(lat,lng){let best=null,area=1e9;
  for(const b of buildings.values()){const[a,c,d,e]=b.bb;if(lat<a||lat>d||lng<c||lng>e)continue;
    if(inPoly(lat,lng,b.path)){const ar=(d-a)*(e-c);if(ar<area){area=ar;best=b;}}}return best;}
function center(path){let la=0,ln=0;path.forEach(p=>{la+=p[0];ln+=p[1];});return[la/path.length,ln/path.length];}

/* =================== house popup with addresses + notes =================== */
function clearSel(){if(hl){hl.setMap(null);hl=null;}if(pop){pop.setMap(null);pop=null;}}
let tapBlock=0;
function onTap(ll){
  if(Date.now()-tapBlock<400)return;
  if($('sbar').classList.contains('open')){openSearch(false);return;}
  if(!$('txtSheet').classList.contains('out-b')){$('txtCancel').click();return;}
  if(!$('accSheet').classList.contains('out-b')){showAcc(false);return;}
  if(editing){editTap(ll);return;}
  houseAt(ll);
}
function houseAt(ll){
  clearSel();
  const lat=ll.getLat(),lng=ll.getLng(),b=buildingAt(lat,lng),path=b?b.path:null;
  if(path)hl=new kakao.maps.Polygon({map,path:path.map(LL),strokeWeight:3,strokeColor:'#1f4fd1',strokeOpacity:1,fillColor:'#1f4fd1',fillOpacity:.25,zIndex:4});
  else hl=new kakao.maps.Circle({map,center:ll,radius:6,strokeWeight:3,strokeColor:'#1f4fd1',fillColor:'#1f4fd1',fillOpacity:.25,zIndex:4});
  const at=path?center(path):[lat,lng];
  geocoder.coord2Address(lng,lat,(r,st)=>{
    if(st!==kakao.maps.services.Status.OK||!r[0]){showPop(at,{nw:'',old:'Адрес не найден',bld:'',path});return;}
    const ra=r[0].road_address,ad=r[0].address;
    showPop(at,{nw:ra?short(ra.address_name):'',bld:ra&&ra.building_name||'',old:ad?short(ad.address_name):'',path});
  });
}
function keyOf(info){return info.old||info.nw||('pt:'+(info.path?center(info.path).join(','):''));}
function showPop(at,info,open){
  if(pop)pop.setMap(null);
  const k=keyOf(info),rec=notes[k],list=rec?rec.notes:[];
  const el=document.createElement('div');el.className='pop';
  el.innerHTML=`<button class="x" aria-label="Закрыть">✕</button>
   <button class="head" aria-expanded="${!!open}">
     ${info.nw?`<div class="new"><span class="lbl n">도로명</span>${esc(info.nw)}${info.bld?` <span class="bld">${esc(info.bld)}</span>`:''}</div>`:''}
     <div class="old"><span class="lbl o">지번</span>${esc(info.old||'—')}</div>
     <div class="more">${open?'Свернуть ▲':(list.length?`Заметки: ${list.length} ▼`:'Добавить заметку ▼')}</div>
   </button>
   ${open?`<div class="pbody"><div class="notes">${list.length?list.map((n,i)=>`<div class="note"><div class="t">${esc(n.t)}</div><div class="d">${new Date(n.at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div><button data-i="${i}" aria-label="Удалить заметку">✕</button></div>`).join(''):'<div class="empty">Заметок пока нет.</div>'}</div>
     <textarea id="nt" placeholder="Например: код двери 1234#, оставлять у охраны"></textarea>
     <button class="add">Сохранить</button></div>`:''}`;
  ['click','mousedown','touchstart','touchend','dblclick','wheel','pointerdown'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation()));
  el.querySelector('.x').onclick=clearSel;
  el.querySelector('.head').onclick=()=>showPop(at,info,!open);
  if(open){
    el.querySelector('.add').onclick=()=>{const t=el.querySelector('#nt').value.trim();if(!t)return;
      notes[k]=notes[k]||{nw:info.nw,old:info.old,bld:info.bld,path:info.path,at,notes:[]};notes[k].notes.push({t,at:Date.now()});store.set(NOTES_KEY,notes);drawNoted();showPop(at,info,true);};
    el.querySelectorAll('.note button').forEach(b=>b.onclick=()=>{notes[k].notes.splice(+b.dataset.i,1);if(!notes[k].notes.length)delete notes[k];store.set(NOTES_KEY,notes);drawNoted();showPop(at,info,true);});
  }
  pop=new kakao.maps.CustomOverlay({map,position:LL(at),content:el,yAnchor:1,zIndex:10,clickable:true});
  if(open){const pt=map.getProjection().containerPointFromCoords(LL(at));if(pt.y<330)map.panBy(0,pt.y-330);}
}
function drawNoted(){
  if(!map)return;noteShapes.forEach(s=>s.setMap(null));noteShapes=[];
  Object.values(notes).forEach(r=>{
    const o={map,strokeWeight:2,strokeColor:'#e8590c',fillColor:'#e8590c',fillOpacity:.3,zIndex:3};
    noteShapes.push(r.path?new kakao.maps.Polygon({...o,path:r.path.map(LL)}):new kakao.maps.Circle({...o,center:LL(r.at),radius:6}));
  });
}

/* =================== search (hidden behind the tab) =================== */
const AREA_C=[35.2075,129.0065],AREA_R=1500;
const sq=$('sq'),sugg=$('sugg');
function openSearch(on){$('sbar').classList.toggle('open',on);$('tab').setAttribute('aria-expanded',on);show($('tab'),!on&&!editing,'r');
  if(on)setTimeout(()=>sq.focus(),200);else{sq.blur();sugg.innerHTML='';}}
$('tab').onclick=()=>openSearch(true);
$('sclose').onclick=()=>{sq.value='';openSearch(false);};
let sTimer,sSeq=0,sItems=[];
sq.addEventListener('input',()=>{clearTimeout(sTimer);sTimer=setTimeout(runSearch,250);});
sq.addEventListener('keydown',e=>{if(e.key==='Enter'&&sItems[0]){e.preventDefault();pick(sItems[0]);}if(e.key==='Escape')openSearch(false);});
const inArea=(lat,lng,addr)=>{if(D.zone.length>2)return inPoly(lat,lng,D.zone);const d=Math.hypot((lat-AREA_C[0])*111000,(lng-AREA_C[1])*91000);return d<=AREA_R&&(!addr||/구포|북구/.test(addr));};
function runSearch(){
  const q=sq.value.trim(),seq=++sSeq;if(!q){sugg.innerHTML='';sItems=[];return;}
  if(!map)return;
  const out=[],seen=new Set(),push=it=>{const k=it.lat.toFixed(5)+','+it.lng.toFixed(5);if(seen.has(k))return;seen.add(k);out.push(it);};
  const ql=q.toLowerCase();
  Object.values(notes).forEach(r=>{const hay=(r.nw+' '+r.old+' '+(r.bld||'')+' '+r.notes.map(n=>n.t).join(' ')).toLowerCase();
    if(hay.includes(ql))push({nm:r.bld||r.nw||r.old,ad:[r.nw,r.old].filter(Boolean).join(' · '),lat:r.at[0],lng:r.at[1],noted:true});});
  const S=kakao.maps.services,loc=new kakao.maps.LatLng(AREA_C[0],AREA_C[1]);let left=2;
  const fin=()=>{if(--left||seq!==sSeq)return;sItems=out.slice(0,12);render();};
  geocoder.addressSearch('부산 북구 '+q,(r,st)=>{if(st===S.Status.OK)r.forEach(a=>{const lat=+a.y,lng=+a.x;if(!inArea(lat,lng,a.address_name))return;
      const ra=a.road_address,ad=a.address;push({nm:ra?short(ra.address_name)+(ra.building_name?' '+ra.building_name:''):short(a.address_name),ad:ad?'지번 '+short(ad.address_name):'',lat,lng});});fin();},{size:10});
  new S.Places().keywordSearch(q,(r,st)=>{if(st===S.Status.OK)r.forEach(p=>{const lat=+p.y,lng=+p.x;if(!inArea(lat,lng,p.address_name))return;
      push({nm:p.place_name,ad:short(p.road_address_name||p.address_name),lat,lng});});fin();},{location:loc,radius:AREA_R,sort:S.SortBy.DISTANCE});
}
function render(){
  sugg.innerHTML=sItems.length?sItems.map((it,i)=>`<li data-i="${i}"><div class="nm">${esc(it.nm)}${it.noted?'<span class="tg">заметка</span>':''}</div>${it.ad?`<div class="ad">${esc(it.ad)}</div>`:''}</li>`).join(''):'<li class="none">На участке ничего не найдено</li>';
  sugg.querySelectorAll('li[data-i]').forEach(li=>li.onclick=()=>pick(sItems[+li.dataset.i]));
}
async function pick(it){
  openSearch(false);if(editing)setEditing(false);const ll=new kakao.maps.LatLng(it.lat,it.lng);
  map.setLevel(2);map.setCenter(ll);try{await loadVisible();}catch(e){}houseAt(ll);
}

const COLORS=['#e8590c','#c92a2a','#f59f00','#2b8a3e','#1f4fd1','#7048e8','#111827','#ffffff'];
const FONTS=[['sys','Обычный','system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif'],
  ['noto','Noto Sans 한글','"Noto Sans KR",system-ui,sans-serif'],['black','Black Han Sans 굵은','"Black Han Sans","Noto Sans KR",sans-serif'],
  ['jua','Jua 둥근','"Jua","Noto Sans KR",sans-serif'],['pen','Nanum Pen 손글씨','"Nanum Pen Script",cursive'],['mono','Моно 123','ui-monospace,Menlo,Consolas,monospace']];
const FONT_CSS=Object.fromEntries(FONTS.map(f=>[f[0],f[2]]));
const SHAPES=[['pin','Метка'],['round','Скруглённый'],['rect','Прямоугольник'],['pill','Капсула'],['ellipse','Овал'],['flag','Флажок']];
const ARROWS=[['plain','Обычная'],['thick','Толстая'],['num','С цифрами от–до'],['chev','Стрелки по линии'],['dash','Штрих-пунктир']];
const defFont=()=>({f:'sys',ls:0,vert:false,b:true,i:false,c:'#ffffff',a:1});
let D=store.get(DRAW_KEY,null);
if(!D){ // migrate the earlier format (labels + arrows)
  const old=store.get('gupo-draw-v1',{});
  D={items:[],zone:old.zone||[],zoneStyle:{c:(old.tools&&old.tools.zone&&old.tools.zone.c)||'#1f4fd1',a:1}};
  (old.labels||[]).forEach(l=>D.items.push({k:'shape',form:'pin',p:l.p,t:l.t,fill:l.c,a:l.a==null?1:l.a,s:l.s||1,font:defFont()}));
  (old.arrows||[]).forEach(a=>D.items.push({k:'arrow',type:'plain',a:a.a,b:a.b,c:a.c,o:a.o==null?1:a.o,w:a.w||5}));
}
D=Object.assign({items:[],zone:[],zoneStyle:{c:'#1f4fd1',a:1},def:{}},D);
D.def=Object.assign({shape:'pin',arrow:'plain',c:'#e8590c',a:1,font:defFont()},D.def);
D.items.forEach((it,i)=>it.id=it.id||('i'+Date.now().toString(36)+i));
const saveD=()=>store.set(DRAW_KEY,D);
const hist=[],fut=[];let lastSnap=0;
function snap(soft){ // remember the state before a change; soft = merge rapid slider moves into one step
  if(soft&&Date.now()-lastSnap<900){lastSnap=Date.now();return;}
  hist.push(JSON.stringify(D));if(hist.length>80)hist.shift();fut.length=0;lastSnap=soft?Date.now():0;updHist();}
function restore(json){const keepSel=sel&&sel.id;D=JSON.parse(json);sel=keepSel?D.items.find(i=>i.id===keepSel)||null:null;saveD();drawAll();refreshUI();}
$('hUndo').onclick=()=>{if(!hist.length)return;fut.push(JSON.stringify(D));restore(hist.pop());updHist();};
$('hRedo').onclick=()=>{if(!fut.length)return;hist.push(JSON.stringify(D));restore(fut.pop());updHist();};
function updHist(){$('hUndo').disabled=!hist.length;$('hRedo').disabled=!fut.length;}
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* =================== edit mode, tools, panels =================== */
let editing=false,tool=null,sel=null,panel=null,arrowStart=null,arrowTmp=null,txtCtx=null;
function setEditing(on){
  editing=on;document.body.classList.toggle('edit',on);
  show($('mainIsl'),!on,'b');show($('closeBtn'),on,'b');show($('toolIsl'),on,'r');show($('histIsl'),on,'l');show($('tab'),!on,'r');
  if(on){clearSel();updHist();$('msg').classList.add('hide');}else{setTool(null);sel=null;openPanel(null);show($('ctxIsl'),false,'t');}
  if(map)map.setZoomable(!(on&&sel));
  drawAll();refreshUI();
}
$('bEdit').onclick=()=>setEditing(true);
$('closeBtn').onclick=()=>setEditing(false);

function setTool(t){
  tool=t;arrowStart=null;if(arrowTmp){arrowTmp.setMap(null);arrowTmp=null;}
  $('cross').hidden=t!=='zone';if(t)select(null,true);
  drawAll();refreshUI();
}
function select(it,quiet){sel=it;if(map)map.setZoomable(!it);if(!quiet){drawAll();refreshUI();}}

['tZone','tShape','tArrow','tFont','tColor'].forEach(id=>$(id).onclick=()=>{
  const k={tZone:'zone',tShape:'shape',tArrow:'arrow',tFont:'font',tColor:'color'}[id];
  if(k==='zone'){openPanel(null);setTool(tool==='zone'?null:'zone');return;}
  openPanel(panel===k?null:k);
});

function openPanel(k){panel=k;const f=$('fly');show(f,!!k,'r');if(k)renderPanel();refreshToolBtns();}
function refreshToolBtns(){
  $('tZone').classList.toggle('on',tool==='zone');$('tShape').classList.toggle('on',panel==='shape'||tool==='shape');
  $('tArrow').classList.toggle('on',panel==='arrow'||tool==='arrow');$('tFont').classList.toggle('on',panel==='font');$('tColor').classList.toggle('on',panel==='color');
  const c=colorTarget();$('cDot').style.background=c.get().c;
}
// what the colour / font panels change: the selected object, the border, or the defaults for new objects
function colorTarget(){
  if(sel&&sel.k==='shape')return{name:'фигура',get:()=>({c:sel.fill,a:sel.a}),set:v=>{if(v.c!=null)sel.fill=v.c;if(v.a!=null)sel.a=v.a;}};
  if(sel&&sel.k==='arrow')return{name:'стрелка',get:()=>({c:sel.c,a:sel.o}),set:v=>{if(v.c!=null)sel.c=v.c;if(v.a!=null)sel.o=v.a;}};
  if(tool==='zone')return{name:'граница',get:()=>D.zoneStyle,set:v=>Object.assign(D.zoneStyle,v)};
  return{name:'новые фигуры и стрелки',get:()=>({c:D.def.c,a:D.def.a}),set:v=>{if(v.c!=null)D.def.c=v.c;if(v.a!=null)D.def.a=v.a;}};
}
function fontTarget(){return sel&&sel.k==='shape'?{name:'выбранная фигура',f:sel.font}:{name:'новые фигуры',f:D.def.font};}

function shapeIcon(form){const m={pin:'<rect x="4" y="3" width="44" height="18" rx="6"/><path d="M22 21l4 6 4-6z"/>',round:'<rect x="4" y="5" width="44" height="20" rx="7"/>',rect:'<rect x="4" y="5" width="44" height="20" rx="1"/>',
  pill:'<rect x="2" y="5" width="48" height="20" rx="10"/>',ellipse:'<ellipse cx="26" cy="15" rx="23" ry="12"/>',flag:'<rect x="8" y="2" width="40" height="16" rx="1"/><rect x="8" y="18" width="2.5" height="11"/>'}[form];
  return `<svg viewBox="0 0 52 30" fill="currentColor" style="color:${D.def.c}">${m}</svg>`;}
function arrowIcon(type){const c=D.def.c,h=`<path d="M40 8l9 7-9 7" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 52 30">${{plain:`<path d="M4 15h42" stroke="${c}" stroke-width="3"/>`+h,

    num:`<path d="M12 15h28" stroke="${c}" stroke-width="3"/>${h}<circle cx="7" cy="15" r="6" fill="${c}"/><text x="7" y="18.5" font-size="8" fill="#fff" text-anchor="middle" font-weight="800">1</text>`,
    chev:`<path d="M4 15h44" stroke="${c}" stroke-width="2.5"/><path d="M12 9l7 6-7 6M26 9l7 6-7 6M40 9l7 6-7 6" fill="none" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/>`,
    dash:`<path d="M4 15h40" stroke="${c}" stroke-width="3" stroke-dasharray="8 3 2 3"/>`+h}[type]}</svg>`;}

  const f=$('fly');
  if(panel==='shape'){
    f.innerHTML=`<h3>Фигуры</h3><div class="grid">${SHAPES.map(([k,n])=>`<button class="opt${tool==='shape'&&D.def.shape===k?' on':''}" data-k="${k}">${shapeIcon(k)}${n}</button>`).join('')}</div>

    f.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{D.def.arrow=b.dataset.k;saveD();setTool('arrow');openPanel(null);});

    f.innerHTML=`<h3>Шрифт</h3><div class="target">Меняется: ${T.name}</div>
     <div class="fonts">${FONTS.map(([k,n,css])=>`<button data-f="${k}" class="${F.f===k?'on':''}" style="font-family:${css.replace(/"/g,'&quot;')}">${n}</button>`).join('')}</div>

       <button data-t="h" class="${!F.vert?'on':''}">Обычно</button><button data-t="v" class="${F.vert?'on':''}">Сверху вниз</button></div>

     <div class="sws">${COLORS.map(c=>`<button class="sw${cur.c===c?' on':''}" data-c="${c}" style="background:${c}" aria-label="Цвет"></button>`).join('')}</div>
     <label class="row">Прозрачность<input type="range" id="cA" min="10" max="100" step="5" value="${Math.round((cur.a==null?1:cur.a)*100)}"><b id="cAV">${Math.round((cur.a==null?1:cur.a)*100)}%</b></label>

/* HSV colour wheel */
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return[f(5),f(3),f(1)].map(x=>Math.round(x*255));}
function rgb2hex(r){return'#'+r.map(x=>x.toString(16).padStart(2,'0')).join('');}
function hex2hsv(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  return{h,s:mx?d/mx:0,v:mx};}
function colorWheel(T){
  const cv=$('wheel'),ctx=cv.getContext('2d'),R=200;let {h,s,v}=hex2hsv(T.get().c);
  const draw=()=>{const img=ctx.createImageData(400,400);
    for(let y=0;y<400;y++)for(let x=0;x<400;x++){const dx=x-R,dy=y-R,d=Math.hypot(dx,dy),i=(y*400+x)*4;if(d>R)continue;
      const [r,g,b]=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,d/R,v);img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255;}
    ctx.putImageData(img,0,0);};
  const knob=()=>{const a=h*Math.PI/180;$('knob').style.left=(100+Math.cos(a)*s*100)+'px';$('knob').style.top=(100+Math.sin(a)*s*100)+'px';
    const hex=rgb2hex(hsv2rgb(h,s,v));$('knob').style.background=hex;$('cPrev').style.background=hex;$('cPrev').style.opacity=(T.get().a==null?1:T.get().a);};
  const apply=()=>{T.set({c:rgb2hex(hsv2rgb(h,s,v))});saveD();drawAll();knob();refreshToolBtns();};
  $('cV').value=Math.round(v*100);$('cVV').textContent=Math.round(v*100)+'%';draw();knob();
  const pickAt=e=>{const r=cv.getBoundingClientRect(),dx=e.clientX-r.left-100,dy=e.clientY-r.top-100;
    h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;s=Math.min(1,Math.hypot(dx,dy)/100);apply();};
  let down=false;
  cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);snap(true);pickAt(e);});
  cv.addEventListener('pointermove',e=>{if(down){snap(true);pickAt(e);}});
  cv.addEventListener('pointerup',()=>down=false);cv.addEventListener('pointercancel',()=>down=false);
  $('cV').oninput=e=>{snap(true);v=e.target.value/100;$('cVV').textContent=e.target.value+'%';draw();apply();};
  $('cA').oninput=e=>{snap(true);T.set({a:e.target.value/100});$('cAV').textContent=e.target.value+'%';saveD();drawAll();knob();};
  $('fly').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{snap();T.set({c:b.dataset.c});({h,s,v}=hex2hsv(b.dataset.c));saveD();drawAll();renderPanel();refreshToolBtns();});
}

/* context island: hint + actions for the current tool or selection */
function refreshUI(){
  refreshToolBtns();

  let hint='',btns=[];
  if(tool==='zone'){
    hint=`Граница: наведи крестик на угол и нажми «Поставить точку». Точки можно двигать пальцем. Точек: ${D.zone.length}`;
    btns=[['Поставить точку','pri',()=>{snap();const c=map.getCenter();D.zone.push([r6(c.getLat()),r6(c.getLng())]);saveD();drawAll();refreshUI();}],
      ['Убрать точку','',()=>{if(!D.zone.length)return;snap();D.zone.pop();saveD();drawAll();refreshUI();}],
      ...(D.zone.length?[['Стереть','danger',function(){if(this.dataset.sure){snap();D.zone=[];saveD();drawAll();refreshUI();}else{this.dataset.sure=1;this.textContent='Точно стереть?';}}]]:[]),
      ['Готово','',()=>setTool(null)]];

  else if(tool==='arrow'){hint=arrowStart?'Теперь нажми, куда указывает стрелка.':`Стрелка «${ARROWS.find(x=>x[0]===D.def.arrow)[1]}»: нажми, откуда, потом куда.`;btns=[['Готово','',()=>setTool(null)]];}

    btns=[['Текст','',()=>openText(sel,false)],['Удалить','danger',delSel],['Снять выбор','',()=>select(null)]];}
  else if(sel&&sel.k==='arrow'){hint='Тяни за середину — переместить, за конец — повернуть. Двумя пальцами — толщина.';
    btns=[...(sel.type==='num'?[['Цифры','',()=>openText(sel,false)]]:[]),['Удалить','danger',delSel],['Снять выбор','',()=>select(null)]];}

/* taps on the map while editing */

  const p=[r6(ll.getLat()),r6(ll.getLng())];
  if(panel){openPanel(null);return;}
  if(tool==='zone'){snap();D.zone.push(p);saveD();drawAll();refreshUI();return;}
  if(tool==='shape'){const it={id:newId(),k:'shape',form:D.def.shape,p,t:'',fill:D.def.c,a:D.def.a,s:1,font:{...D.def.font}};openText(it,true);return;}
  if(tool==='arrow'){
    if(!arrowStart){arrowStart=p;arrowTmp=new kakao.maps.Circle({map,center:ll,radius:3,strokeWeight:3,strokeColor:D.def.c,fillColor:D.def.c,fillOpacity:1,zIndex:6});refreshUI();return;}
    const type=D.def.arrow,it={id:newId(),k:'arrow',type,a:arrowStart,b:p,c:D.def.c,o:D.def.a,w:type==='thick'?14:5};

/* =================== rendering =================== */
const elOf=new WeakMap(),ovOf=new Map(),objsOf=new Map();let zoneShape=null,vtx=[];
const A1=v=>v==null?1:v;
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function styleShape(el,it){
  const F=it.font||defFont();
  el.className='shp '+it.form+(F.vert?' vert':'')+(sel===it?' sel':'');
  el.style.setProperty('--bg',it.fill);el.style.background=it.fill;el.style.opacity=A1(it.a);
  el.style.fontSize=(14*(it.s||1)).toFixed(1)+'px';el.style.fontFamily=FONT_CSS[F.f]||FONT_CSS.sys;

function geoLen(a,b){return Math.hypot((a[0]-b[0])*111000,(a[1]-b[1])*91000);}
function drawItem(it){

    ['mousedown','touchstart','touchend','dblclick'].forEach(ev=>el.addEventListener(ev,e=>{if(editing)e.stopPropagation();}));
    el.addEventListener('click',e=>{if(!editing)return;e.stopPropagation();if(Date.now()-tapBlock<400)return;tapBlock=Date.now();if(tool)setTool(null);select(it);});
    const anch=it.form==='pin'?1:it.form==='flag'?1:.5,xa=it.form==='flag'?0:.5;

    const w=it.w||5,c=it.c,o=.95*A1(it.o),path=[LL(it.a),LL(it.b)];
    if(sel===it)objs.push(new kakao.maps.Polyline({map,path,strokeWeight:w+12,strokeColor:'#1f4fd1',strokeOpacity:.4,zIndex:4}));
    if(it.type==='chev'){ // a row of arrowheads along the line
      const n=Math.max(2,Math.min(24,Math.round(geoLen(it.a,it.b)/22)));
      objs.push(new kakao.maps.Polyline({map,path,strokeWeight:Math.max(2,w*.6),strokeColor:c,strokeOpacity:o,zIndex:5}));
      for(let i=1;i<=n;i++){const t0=(i-.35)/n,t1=i/n,P=t=>new kakao.maps.LatLng(it.a[0]+(it.b[0]-it.a[0])*t,it.a[1]+(it.b[1]-it.a[1])*t);

function undraw(it){(objsOf.get(it.id)||[]).forEach(o=>o.setMap(null));objsOf.delete(it.id);ovOf.delete(it.id);}
function drawAll(){
  if(!map)return;for(const [id,objs] of objsOf)objs.forEach(o=>o.setMap(null));objsOf.clear();ovOf.clear();
  vtx.forEach(m=>m.setMap(null));vtx=[];if(zoneShape){zoneShape.setMap(null);zoneShape=null;}
  const z=D.zoneStyle;
  if(D.zone.length>1)zoneShape=new kakao.maps.Polygon({map,path:D.zone.map(LL),strokeWeight:4,strokeColor:z.c,strokeStyle:'dash',strokeOpacity:.95*A1(z.a),fillColor:z.c,fillOpacity:(tool==='zone'?.08:.04)*A1(z.a),zIndex:2});
  if(editing&&tool==='zone'){const img=new kakao.maps.MarkerImage('data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="8" fill="#fff" stroke="${z.c}" stroke-width="4"/></svg>`),new kakao.maps.Size(26,26),{offset:new kakao.maps.Point(13,13)});

      kakao.maps.event.addListener(m,'dragstart',()=>snap());
      kakao.maps.event.addListener(m,'dragend',()=>{const q=m.getPosition();D.zone[i]=[r6(q.getLat()),r6(q.getLng())];saveD();drawAll();});vtx.push(m);});}

/* =================== gestures =================== */
const mapEl=$('map');
const evPt=e=>{const r=mapEl.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
const toLLpx=([x,y])=>map.getProjection().coordsFromContainerPoint(new kakao.maps.Point(x,y));
const toPx=p=>{const q=map.getProjection().containerPointFromCoords(LL(p));return[q.x,q.y];};
function segDist(P,A,B){const dx=B[0]-A[0],dy=B[1]-A[1],l=dx*dx+dy*dy||1;let u=((P[0]-A[0])*dx+(P[1]-A[1])*dy)/l;u=Math.max(0,Math.min(1,u));return Math.hypot(P[0]-A[0]-u*dx,P[1]-A[1]-u*dy);}
function findArrowAt(P){let best=null,bd=18;
  D.items.forEach(a=>{if(a.k!=='arrow')return;const A=toPx(a.a),B=toPx(a.b),d=segDist(P,A,B)-(a.w||5)/2;if(d<bd){bd=d;
    const part=Math.hypot(P[0]-B[0],P[1]-B[1])<28?'b':Math.hypot(P[0]-A[0],P[1]-A[1])<28?'a':'all';best={obj:a,part};}});return best;}
(function(){
  let st=null,pinch=null;

    if(!map||e.button>0||!e.isPrimary)return;
    if(e.target.closest&&e.target.closest('.pop'))return;
    const P=evPt(e);
    if(!editing){ // normal mode: press & hold a house = select it
      st={kind:'house',x:P[0],y:P[1],timer:setTimeout(()=>{st=null;houseAt(toLLpx(P));tapBlock=Date.now();if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}},500)};return;}
    if(tool==='zone'||tool==='arrow')return;
    const el=e.target.closest&&e.target.closest('.shp');let hit=null;
    if(el&&elOf.has(el))hit={obj:elOf.get(el),el};
    else{const a=findArrowAt(P);if(a)hit={obj:a.obj,part:a.part};}
    if(!hit)return;
    st={...hit,x:P[0],y:P[1],dragging:false};
    if(sel===hit.obj)start();else st.timer=setTimeout(start,400);
  }
  function start(){
    if(!st)return;if(tool)setTool(null);if(sel!==st.obj)select(st.obj);
    snap();st.dragging=true;map.setDraggable(false);mapEl.classList.add('dragging');
    if(navigator.vibrate)try{navigator.vibrate(20)}catch(e){}
    const o=st.obj;
    if(o.k==='shape'){st.P0=toPx(o.p);const ov=ovOf.get(o.id);st.el=ov&&ov.getContent?ov.getContent():document.querySelector('.shp.sel');if(st.el)st.el.classList.add('lift');}
    else{st.A=toPx(o.a);st.B=toPx(o.b);}
  }
  function move(e){
    if(!st||pinch)return;const P=evPt(e);

    e.preventDefault();e.stopPropagation();
    const dx=P[0]-st.x,dy=P[1]-st.y,o=st.obj,mv=S=>{const ll=toLLpx([S[0]+dx,S[1]+dy]);return[r6(ll.getLat()),r6(ll.getLng())];};
    if(o.k==='shape'){o.p=mv(st.P0);const ov=ovOf.get(o.id);if(ov)ov.setPosition(LL(o.p));}
    else{if(st.part!=='b')o.a=mv(st.A);if(st.part!=='a')o.b=mv(st.B);drawItem(o);}

  }
  function tstart(e){

    if(!editing||!sel||e.touches.length!==2)return;
    if(st){if(st.dragging){map.setDraggable(true);mapEl.classList.remove('dragging');}st=null;}
    const [a,b]=e.touches;snap();
    pinch={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,v0:sel.k==='shape'?(sel.s||1):(sel.w||5)};

      const [a,b]=e.touches;resizeSel(pinch.v0*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d0);return;}
    if(st&&st.dragging){e.preventDefault();e.stopPropagation();}

  mapEl.addEventListener('touchmove',tmove,{capture:true,passive:false});
  mapEl.addEventListener('touchend',tend,true);mapEl.addEventListener('touchcancel',tend,true);
  mapEl.addEventListener('mousemove',e=>{if(st&&st.dragging){e.preventDefault();e.stopPropagation();}},true);
  mapEl.addEventListener('wheel',e=>{if(!editing||!sel)return;e.preventDefault();e.stopPropagation();snap(true);
    const v=sel.k==='shape'?(sel.s||1):(sel.w||5);resizeSel(v*(e.deltaY<0?1.1:1/1.1));saveD();},{capture:true,passive:false});
  mapEl.addEventListener('contextmenu',e=>{if(st)e.preventDefault();});
})();
function resizeSel(v){
  if(!sel)return;
  if(sel.k==='shape'){sel.s=+Math.max(.5,Math.min(4,v)).toFixed(2);const ov=ovOf.get(sel.id),el=ov&&ov.getContent?ov.getContent():document.querySelector('.shp.sel');if(el)el.style.fontSize=(14*sel.s).toFixed(1)+'px';}
  else{sel.w=+Math.max(2,Math.min(30,v)).toFixed(1);drawItem(sel);}
}
updHist();refreshToolBtns();
